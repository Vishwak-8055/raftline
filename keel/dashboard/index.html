<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keel — Cluster Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1420;
    --bg-deep: #070d15;
    --panel: #16263b;
    --panel-border: #24384f;
    --text: #e7ebef;
    --text-dim: #7c8ca0;
    --text-faint: #4c5c70;
    --leader: #d9a441;
    --follower: #5a8cae;
    --candidate: #e0793c;
    --dead: #6b4646;
    --dead-text: #b08080;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  a, button, input { font-family: inherit; }

  /* ---------- waterline divider: a small nautical signature, used
     sparingly, not as a generic decorative rule ---------- */
  .waterline {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 8px;
    margin: 28px 0 18px;
    opacity: 0.5;
  }
  .waterline span {
    flex: 1;
    height: 1px;
    background: var(--panel-border);
  }
  .waterline::before, .waterline::after {
    content: '';
    width: 1px;
    height: 8px;
    background: var(--panel-border);
  }

  header {
    padding: 22px 32px 0;
    max-width: 1100px;
    margin: 0 auto;
  }
  header .wordmark {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header .wordmark h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header .wordmark span.tagline {
    color: var(--text-dim);
    font-size: 13px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px 48px;
  }

  /* ---------- connection panel ---------- */
  .connect {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .connect label {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .connect input {
    flex: 1;
    min-width: 260px;
    background: var(--bg-deep);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 3px;
    font-size: 13px;
  }
  .connect input:focus {
    outline: none;
    border-color: var(--follower);
  }
  .connect button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
  }
  .connect button:hover { border-color: var(--text-dim); }
  .connect .hint {
    width: 100%;
    color: var(--text-faint);
    font-size: 11.5px;
  }

  /* ---------- hero status strip: the one thing you glance at ---------- */
  .hero {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    overflow: hidden;
    background: var(--panel);
  }
  .hero__cell {
    padding: 16px 20px;
    flex: 1;
    border-right: 1px solid var(--panel-border);
  }
  .hero__cell:last-child { border-right: none; }
  .hero__cell.is-leader-cell { flex: 1.6; background: rgba(217, 164, 65, 0.07); }
  .hero__label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .hero__value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
  }
  .hero__value.leader-color { color: var(--leader); }
  .hero__value.warn { color: var(--candidate); }
  .hero__sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-left: 8px;
  }

  /* ---------- node grid: instrument cards, not SaaS cards ---------- */
  .node-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .node-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--follower);
    border-radius: 3px;
    padding: 12px 14px 10px;
  }
  .node-card.role-leader { border-left-color: var(--leader); }
  .node-card.role-candidate { border-left-color: var(--candidate); }
  .node-card.role-unreachable {
    border-left-color: var(--dead);
    border-left-style: dashed;
    opacity: 0.55;
  }
  .node-card.pulse { animation: pulse 900ms ease-out; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 164, 65, 0.35); }
    100% { box-shadow: 0 0 0 10px rgba(217, 164, 65, 0); }
  }

  .node-card__top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .node-card__id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }
  .node-card__role {
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 2px;
    color: var(--bg);
    background: var(--follower);
  }
  .role-leader .node-card__role { background: var(--leader); }
  .role-candidate .node-card__role { background: var(--candidate); }
  .role-unreachable .node-card__role { background: var(--dead); color: var(--dead-text); }

  .node-card__stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    margin: 0;
  }
  .node-card__stats div { display: flex; flex-direction: column; }
  .node-card__stats dt {
    font-size: 10px;
    color: var(--text-faint);
  }
  .node-card__stats dd {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .node-card__unreachable-msg {
    font-size: 12px;
    color: var(--dead-text);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ---------- event log: a ship's log, not a toast tray ---------- */
  .event-log {
    background: var(--bg-deep);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px 0;
  }
  .event-log__empty {
    color: var(--text-faint);
    font-size: 12.5px;
    padding: 12px 16px;
  }
  .event-row {
    display: flex;
    gap: 12px;
    padding: 5px 16px;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .event-row time {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-faint);
    flex-shrink: 0;
  }
  .event-row .msg { color: var(--text-dim); }
  .event-row .msg b { color: var(--text); font-weight: 500; }

  .section-label {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <h1>Keel</h1>
    <span class="tagline">cluster monitor</span>
  </div>
</header>

<main>
  <div class="connect">
    <label for="seed-input">Watching</label>
    <input id="seed-input" type="text" value="http://localhost:9101, http://localhost:9102, http://localhost:9103, http://localhost:9104, http://localhost:9105" />
    <button id="connect-btn">Apply</button>
    <span class="hint">Comma-separated node addresses. Enter just one — the dashboard discovers the rest from its <span class="mono">/status</span> response.</span>
  </div>

  <div class="waterline"><span></span></div>

  <div class="hero" id="hero">
    <div class="hero__cell is-leader-cell">
      <span class="hero__label">Leader</span>
      <span class="hero__value" id="hero-leader">—</span>
    </div>
    <div class="hero__cell">
      <span class="hero__label">Term</span>
      <span class="hero__value" id="hero-term">—</span>
    </div>
    <div class="hero__cell">
      <span class="hero__label">Reachable</span>
      <span class="hero__value" id="hero-reachable">—</span>
    </div>
    <div class="hero__cell">
      <span class="hero__label">Quorum needed</span>
      <span class="hero__value" id="hero-quorum">—</span>
    </div>
  </div>

  <div class="waterline"><span></span></div>

  <p class="section-label">Nodes</p>
  <div class="node-grid" id="node-grid"></div>

  <div class="waterline"><span></span></div>

  <p class="section-label">Event log</p>
  <div class="event-log" id="event-log">
    <div class="event-log__empty">Waiting for the first poll…</div>
  </div>
</main>

<script>
(function () {
  const POLL_MS = 600;
  const FETCH_TIMEOUT_MS = 1200;

  /** address -> last known /status payload, or null if unreachable */
  let known = {};
  /** address -> previous payload, for diffing into events */
  let previous = {};
  let events = [];
  let pollHandle = null;

  const grid = document.getElementById('node-grid');
  const eventLog = document.getElementById('event-log');
  const seedInput = document.getElementById('seed-input');

  function parseAddresses(raw) {
    return raw.split(',').map(s => s.trim().replace(/\/$/, '')).filter(Boolean);
  }

  function pushEvent(message) {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    events.unshift({ time, message });
    events = events.slice(0, 200);
    renderEvents();
  }

  async function fetchStatus(address) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(address + '/status', { signal: controller.signal });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  function diffAndLog(address, before, after) {
    const label = after ? after.node_id : address;
    if (!before && after) {
      pushEvent(`<b>${label}</b> came online (term ${after.term})`);
    } else if (before && !after) {
      pushEvent(`<b>${label}</b> stopped responding`);
    } else if (before && after) {
      if (before.role !== after.role) {
        pushEvent(`<b>${label}</b> changed role: ${before.role} → <b>${after.role}</b> (term ${after.term})`);
      } else if (before.term !== after.term) {
        pushEvent(`<b>${label}</b> advanced to term ${after.term}`);
      }
      if (before.last_included_index !== after.last_included_index && after.last_included_index > 0) {
        pushEvent(`<b>${label}</b> compacted its log through index ${after.last_included_index}`);
      }
    }
  }

  async function pollOnce() {
    const seeds = parseAddresses(seedInput.value);
    // Discover any addresses we don't already know about, from any
    // reachable node's view of the cluster (works from a single seed).
    const addressSet = new Set([...seeds, ...Object.keys(known)]);
    for (const addr of Object.keys(known)) {
      const s = known[addr];
      if (s && s.peer_addresses) {
        Object.values(s.peer_addresses).forEach(a => addressSet.add(a.replace(/\/$/, '')));
      }
    }

    const addresses = Array.from(addressSet);
    const results = await Promise.all(addresses.map(fetchStatus));

    const nextKnown = {};
    addresses.forEach((addr, i) => {
      nextKnown[addr] = results[i];
      diffAndLog(addr, known[addr], results[i]);
    });

    previous = known;
    known = nextKnown;
    render();
  }

  function render() {
    renderHero();
    renderGrid();
  }

  function renderHero() {
    const reachable = Object.values(known).filter(Boolean);
    const leaders = reachable.filter(s => s.role === 'leader');
    // A stale, partitioned leader can coexist with a real one; the one
    // with the higher term is the one anyone should trust.
    const trueLeader = leaders.sort((a, b) => b.term - a.term)[0];
    const maxTerm = reachable.length ? Math.max(...reachable.map(s => s.term)) : null;
    const clusterSize = reachable.length
      ? Math.max(...reachable.map(s => s.cluster_size || 1))
      : Object.keys(known).length;
    const quorum = clusterSize ? Math.floor(clusterSize / 2) + 1 : null;

    document.getElementById('hero-leader').textContent = trueLeader ? trueLeader.node_id : 'no leader';
    document.getElementById('hero-leader').className = 'hero__value' + (trueLeader ? ' leader-color' : ' warn');
    document.getElementById('hero-term').textContent = maxTerm ?? '—';
    document.getElementById('hero-reachable').textContent =
      Object.keys(known).length ? `${reachable.length} / ${Object.keys(known).length}` : '—';
    document.getElementById('hero-quorum').textContent = quorum ?? '—';
  }

  function renderGrid() {
    const addresses = Object.keys(known).sort();
    if (addresses.length === 0) {
      grid.innerHTML = '<p class="event-log__empty">No nodes configured yet.</p>';
      return;
    }

    grid.innerHTML = addresses.map(addr => {
      const s = known[addr];
      const prev = previous[addr];
      const roleChanged = prev && s && prev.role !== s.role;
      if (!s) {
        return `
          <div class="node-card role-unreachable">
            <div class="node-card__top">
              <span class="node-card__id">${addr.replace(/^https?:\/\//, '')}</span>
              <span class="node-card__role">unreachable</span>
            </div>
            <div class="node-card__unreachable-msg">no response</div>
          </div>`;
      }
      return `
        <div class="node-card role-${s.role}${roleChanged ? ' pulse' : ''}">
          <div class="node-card__top">
            <span class="node-card__id">${s.node_id}</span>
            <span class="node-card__role">${s.role}</span>
          </div>
          <dl class="node-card__stats">
            <div><dt>term</dt><dd>${s.term}</dd></div>
            <div><dt>log</dt><dd>${s.log_length}</dd></div>
            <div><dt>commit</dt><dd>${s.commit_index}</dd></div>
            <div><dt>snapshot</dt><dd>${s.last_included_index}</dd></div>
          </dl>
        </div>`;
    }).join('');
  }

  function renderEvents() {
    if (events.length === 0) {
      eventLog.innerHTML = '<div class="event-log__empty">Waiting for the first poll…</div>';
      return;
    }
    eventLog.innerHTML = events.map(e =>
      `<div class="event-row"><time>${e.time}</time><span class="msg">${e.message}</span></div>`
    ).join('');
  }

  function start() {
    known = {};
    previous = {};
    if (pollHandle) clearInterval(pollHandle);
    pollOnce();
    pollHandle = setInterval(pollOnce, POLL_MS);
  }

  document.getElementById('connect-btn').addEventListener('click', start);
  seedInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });

  start();
})();
</script>

</body>
</html>
